# testing mobil: the phone app of testing-desktop, a Tauri 2 shell for Android (iOS later, with a Mac).
#
# Its own Cargo project beside the workspace of the hub, as Tauri's `src-tauri` is: it builds for Android with the NDK
# and pulls Tauri, which the hub never needs. Built and checked on the private machine only (`not-on-workstation`,
# `MREL-06`). The page is the third entry of `ui/` (`main.mobile.ts`); the shell holds the way to the hub, the keys
# and the session (appkit-mobile), and the page asks it over the bridge.

[package]
name = "testing-mobile"
version = "0.1.0"
description = "testing mobil: the fleet, red CI and reruns of testing-desktop on a phone"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Stefan Bartl"]
repository = "https://github.com/WKDSteve/testing-desktop"
publish = false

[lib]
name = "testing_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[build-dependencies]
tauri-build = { version = "2.7", default-features = false, features = [] }

[dependencies]
# The way to the hub, pairing, the device login, bounded requests, the kept pairing and copy (appkit's mobile basis).
appkit-mobile = { version = "0.0.0", git = "https://github.com/WKDSteve/appkit", tag = "v0.50.0" }
# The Android side of the basis: device keys in the Keystore (the trigger key behind the biometrics), the folder of a
# cloned vault, UnifiedPush.
tauri-plugin-appkit = { version = "0.0.0", git = "https://github.com/WKDSteve/appkit", tag = "v0.50.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", default-features = false, features = ["wry", "compression"] }
tokio = { version = "1", default-features = false, features = ["sync", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# On a desktop (the preview of a developer) the device keys are keys in memory: there is no Keystore.
[target.'cfg(not(target_os = "android"))'.dependencies]
appkit-mobile = { version = "0.0.0", git = "https://github.com/WKDSteve/appkit", tag = "v0.50.0", features = ["software-signer"] }

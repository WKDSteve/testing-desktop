[package]
name = "testing-hub"
version = "0.1.0"
description = "Hub of testing-desktop: the test and CI results of the repositories that use testing.nvim (on appkit)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[lints]
workspace = true

[lib]
name = "testing_hub"
path = "src/lib.rs"

[[bin]]
name = "testing-hub"
path = "src/main.rs"

[dependencies]
appkit-core.workspace = true
appkit-hub.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "signal", "process", "time"] }

[dev-dependencies]
appkit-scratch.workspace = true
appkit-testkit.workspace = true
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "io-util", "net", "time"] }

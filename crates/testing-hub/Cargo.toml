[package]
name = "testing-hub"
version = "0.1.0"
description = "Hub of testing-desktop: the test and CI results of the repositories that use testing.nvim (on appkit)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[lints]
workspace = true

[lib]
name = "testing_hub"
path = "src/lib.rs"

[[bin]]
name = "testing-hub"
path = "src/main.rs"

[dependencies]
appkit-core.workspace = true
# push-net: the hub sends Web Push to phones (testing mobil).
appkit-hub = { workspace = true, features = ["push-net"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "signal", "process", "time", "io-util", "fs"] }

[dev-dependencies]
appkit-scratch.workspace = true
appkit-testkit.workspace = true
# A test phone signs its login and the confirmation of a rerun (tests/phone.rs), as the hub checks them.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
sha2 = "0.11"
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "io-util", "net", "time"] }
